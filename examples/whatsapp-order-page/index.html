<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order on WhatsApp</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f6f4ef;color:#1d1d1b;padding-bottom:150px}
header{background:#14532d;color:#fff;padding:22px 16px}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;opacity:.9;font-size:15px}
main{max-width:560px;margin:0 auto;padding:0 12px}
h2{font-size:17px;margin:22px 4px 8px;color:#14532d}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:16px}
.desc{font-size:13px;color:#666;margin-top:2px}
.price{font-size:14px;margin-top:4px;color:#14532d;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid #14532d;background:#fff;color:#14532d;font-size:22px;line-height:1}
.qty button.add{background:#14532d;color:#fff}
.qty span{min-width:22px;text-align:center;font-weight:600}
.form{background:#fff;border-radius:12px;padding:14px;margin-top:8px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],textarea{width:100%;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px;font-family:inherit}
.radio{display:flex;gap:16px;font-size:16px}
.radio label{font-weight:400;margin:0;display:flex;align-items:center;gap:6px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px}
#bar .in{max-width:560px;margin:0 auto}
#sum{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
#send{width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:#25d366;color:#fff}
#msg{color:#b91c1c;font-size:14px;min-height:18px;margin-bottom:6px}
</style>
</head>
<body>
<header><h1 id="shopName"></h1><p id="shopNote"></p></header>
<main>
  <div id="menu"></div>
  <h2>Your details</h2>
  <div class="form">
    <label for="cname">Your name</label>
    <input type="text" id="cname" autocomplete="name">
    <label>How do you want it?</label>
    <div class="radio">
      <label><input type="radio" name="mode" value="Pickup" checked> Pickup</label>
      <label><input type="radio" name="mode" value="Delivery"> Delivery</label>
    </div>
    <div id="addrBox" hidden>
      <label for="addr">Delivery address</label>
      <textarea id="addr" rows="2"></textarea>
    </div>
  </div>
</main>
<div id="bar"><div class="in">
  <div id="msg" role="alert"></div>
  <div id="sum"><span id="count">0 items</span><span id="total"></span></div>
  <button id="send" type="button">Send order on WhatsApp</button>
</div></div>
<script>
/* ============ EDIT THIS BLOCK ONLY ============ */
var SHOP = {
  name: "Mama T's Kitchen",              // shop name
  note: "Open 9am - 9pm. Order here, we reply on WhatsApp.",
  phone: "10000000000",                  // WhatsApp number: country code + number, no + and no spaces
  currency: "$"                          // currency sign or code
};
var MENU = [
  { category: "Meals", items: [
    { name: "Jollof rice & chicken", desc: "With fried plantain", price: 4.50 },
    { name: "Beans & plantain",      desc: "Stewed beans",        price: 3.00 },
    { name: "Grilled fish",          desc: "Whole tilapia, pepper sauce", price: 6.00 }
  ]},
  { category: "Drinks", items: [
    { name: "Water 50cl",  desc: "", price: 0.50 },
    { name: "Soft drink",  desc: "Ask for flavours", price: 1.00 }
  ]}
];
/* ============ END OF EDIT BLOCK ============ */

var qty = {};
function money(n){ return SHOP.currency + n.toFixed(2); }
function el(tag, cls, text){ var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function allItems(){ var out=[]; MENU.forEach(function(c){ c.items.forEach(function(i){ out.push(i); }); }); return out; }
function totals(){
  var count=0,total=0,lines=[];
  allItems().forEach(function(i,idx){
    var q=qty[idx]||0;
    if(q>0){ count+=q; total+=q*i.price; lines.push(q+" x "+i.name+" = "+money(q*i.price)); }
  });
  return {count:count,total:total,lines:lines};
}
function buildMessage(name, mode, addr){
  var t=totals();
  var parts=["New order - "+SHOP.name,""].concat(t.lines);
  parts.push("","Total: "+money(t.total),"","Name: "+name,"Type: "+mode);
  if(mode==="Delivery") parts.push("Address: "+addr);
  return parts.join("\n");
}
function validate(name, mode, addr){
  if(totals().count===0) return "Please add at least one item.";
  if(!name.trim()) return "Please type your name.";
  if(mode==="Delivery" && !addr.trim()) return "Please type your delivery address.";
  return "";
}
function refresh(){
  var t=totals();
  document.getElementById("count").textContent=t.count+(t.count===1?" item":" items");
  document.getElementById("total").textContent=money(t.total);
}
function render(){
  document.title="Order - "+SHOP.name;
  document.getElementById("shopName").textContent=SHOP.name;
  document.getElementById("shopNote").textContent=SHOP.note;
  var menu=document.getElementById("menu"), idx=0;
  MENU.forEach(function(c){
    menu.appendChild(el("h2",null,c.category));
    c.items.forEach(function(i){
      var id=idx++;
      var row=el("div","item"), info=el("div","info");
      info.appendChild(el("div","name",i.name));
      if(i.desc) info.appendChild(el("div","desc",i.desc));
      info.appendChild(el("div","price",money(i.price)));
      var q=el("div","qty"), minus=el("button",null,"\u2212"), num=el("span",null,"0"), plus=el("button","add","+");
      minus.type=plus.type="button";
      minus.setAttribute("aria-label","Remove one "+i.name);
      plus.setAttribute("aria-label","Add one "+i.name);
      function set(v){ qty[id]=Math.max(0,Math.min(99,v)); num.textContent=qty[id]; refresh(); document.getElementById("msg").textContent=""; }
      minus.onclick=function(){ set((qty[id]||0)-1); };
      plus.onclick=function(){ set((qty[id]||0)+1); };
      q.appendChild(minus); q.appendChild(num); q.appendChild(plus);
      row.appendChild(info); row.appendChild(q); menu.appendChild(row);
    });
  });
  var radios=document.querySelectorAll("input[name=mode]");
  for(var r=0;r<radios.length;r++){
    radios[r].onchange=function(){ document.getElementById("addrBox").hidden=(this.value!=="Delivery"); };
  }
  document.getElementById("send").onclick=function(){
    var name=document.getElementById("cname").value;
    var mode=document.querySelector("input[name=mode]:checked").value;
    var addr=document.getElementById("addr").value;
    var err=validate(name,mode,addr);
    document.getElementById("msg").textContent=err;
    if(err) return;
    window.location.href="https://wa.me/"+SHOP.phone+"?text="+encodeURIComponent(buildMessage(name.trim(),mode,addr.trim()));
  };
  refresh();
}
if(typeof document!=="undefined") render();
if(typeof module!=="undefined") module.exports={qty:qty,totals:totals,buildMessage:buildMessage,validate:validate,money:money};
</script>
</body>
</html>
